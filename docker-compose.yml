version: "3.8"

services:
  db:
    image: postgres@sha256:b3968e348b48f1198cc6de6611d055dbad91cd561b7990c406c3fc28d7095b21
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DB_USER}
      # Use password from secret file
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    secrets:
      - db_password
    networks:
      - internal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # Explicitly check specific DB name to ensure full readiness
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: always
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - SERVER_PORT=${SERVER_PORT:-8080}
      # Tell app to read password from this file
      - DB_PASSWORD_FILE=/run/secrets/db_password
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - db_password
    networks:
      - internal
    # Logging limits to prevent storage exhaustion
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://localhost:${SERVER_PORT:-8080}/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 3

# Define secrets source
secrets:
  db_password:
    file: ./secrets/db_password.txt

volumes:
  postgres_data:

# Internal network (no direct host access by default unless ports mapped)
networks:
  internal:
